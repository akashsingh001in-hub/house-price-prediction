<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            text-align: center;
            padding: 30px;
        }
        .container {
            background: white;
            max-width: 420px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #bbb;
        }
        input, button {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .result {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>House Price Prediction</h1>
        <p>Enter house details</p>

        <form method="POST">
            <input type="number" name="area"
                   placeholder="Area (sq ft)" min="1" required>

            <input type="number" name="bedrooms"
                   placeholder="Number of bedrooms" min="1" required>

            <input type="number" name="bathrooms"
                   placeholder="Number of bathrooms" min="1" required>

            <button type="submit">Predict Price</button>
        </form>

        {% if prediction is not none %}
    <p class="result">
        Predicted Price: ₹{{ "{:,.0f}".format(prediction) }}
    </p>
    <small>This is an estimate from sample training data.</small>
{% endif %}
    </div>
</body>
</html>
